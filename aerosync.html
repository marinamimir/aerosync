<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{var a=JSON.parse(localStorage.getItem('aerosync.appearance')||'{}')||{};var dk=a.mode==='dark'||(a.mode!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(dk)document.documentElement.classList.add('dark');if(a.style==='simple')document.documentElement.setAttribute('data-style','simple');}catch(e){}</script>
    <title>AeroSync OS</title>
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== Temas Globais e UI Cocoon Refinada ===== */
        :root {
            --accent: #d88c9a;          /* Padrão: Strawberry Shortcake */
            --accent-2: #f2d0d9;        
            --accent-glow: rgba(216, 140, 154, 0.35);
            --accent-soft: #fcf3f5;     
            --bg-base: #f7f9fc;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 1);
            --shadow-soft: 0 16px 40px -12px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.02) 100%);
        }

        .mobile-frame {
            width: 100%; max-width: 414px; height: 896px; max-height: 100vh;
            background-color: #ffffff;
            border-radius: 44px; /* Squircle mais acentuado */
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.15), inset 0 0 0 10px #f1f5f9;
            overflow: hidden; position: relative; display: flex; flex-direction: column;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estética Vidro (Glassmorphism Premium) */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft), inset 0 2px 0 rgba(255,255,255,0.8);
            border-radius: 32px;
        }

        /* Botão Ação Principal */
        .acrylic-fab {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            box-shadow: inset 0 4px 10px rgba(255,255,255,0.6), inset 0 -4px 10px rgba(0,0,0,0.1), 0 12px 24px var(--accent-glow);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
        }
        .acrylic-fab:active { transform: translateY(4px) scale(0.92); }

        /* Navegação Doca */
        .glass-dock {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border-radius: 99px;
        }
        .nav-btn {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; color: #9ca3af; transition: all 0.2s;
        }
        .nav-btn.active { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 2px 5px rgba(0,0,0,0.04); }

        /* Cards de Tarefa Suavizados */
        .task-item {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        /* Nova Escala de Dificuldade (5 Bolinhas) */
        .diff-dot {
            width: 14px; height: 14px; border-radius: 50%;
            background: #e2e8f0; cursor: pointer; transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        .diff-dot:hover { transform: scale(1.2); }
        .diff-1.active { background: #86efac; box-shadow: 0 0 10px rgba(134,239,172,0.5); }
        .diff-2.active { background: #fef08a; box-shadow: 0 0 10px rgba(254,240,138,0.5); }
        .diff-3.active { background: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .diff-4.active { background: #f97316; box-shadow: 0 0 10px rgba(249,115,22,0.5); }
        .diff-5.active { background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.5); }

        /* Avatar Customizado */
        .avatar-container {
            width: 52px; height: 52px; border-radius: 18px;
            border: 3px solid #fff; box-shadow: var(--shadow-soft);
            overflow: hidden; background: var(--accent-soft);
            position: relative;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Modo Escuro Refinado (OLED friendly) */
        html.dark body { background-color: #0f111a; }
        html.dark .mobile-frame { background-color: #1a1d2d; box-shadow: inset 0 0 0 10px #0f111a; }
        html.dark .glass-panel { background: rgba(30, 34, 51, 0.7); border-color: rgba(255,255,255,0.05); }
        html.dark .task-item { background: #232738; border-color: #2c3145; }
        html.dark .glass-dock { background: rgba(20, 23, 36, 0.8); border-color: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="mobile-frame">
        
        <!-- Header & Avatar -->
        <div class="px-6 pt-8 pb-2 flex justify-between items-center z-10">
            <div>
                <h1 id="app-title" class="text-3xl font-black text-gray-800 tracking-tight">Organização</h1>
                <p class="text-sm text-gray-400 font-bold mt-1" id="date-header">Terça, 10 Nov</p>
            </div>
            <label for="avatar-upload" class="avatar-container cursor-pointer" title="Trocar foto de perfil">
                <img id="user-avatar" src="https://api.dicebear.com/7.x/notionists/svg?seed=Mari&backgroundColor=transparent" alt="Avatar" class="avatar-img">
                <input type="file" id="avatar-upload" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Área Principal de Conteúdo -->
        <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar pb-32 px-6 pt-4 relative">
            
            <!-- Views Placeholder (Atualmente Tasks. Finanças e Hobbies entrarão aqui via JS) -->
            <div id="view-tasks" class="view-section block">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-extrabold text-gray-800 text-xl">Suas Missões</h3>
                    <!-- Placeholder para Ícones de View (Lista/Grid/Kanban) -->
                    <div class="flex gap-2 bg-gray-100 rounded-full p-1">
                        <button class="w-8 h-8 rounded-full bg-white shadow-sm text-[var(--accent)]"><i class="fas fa-list"></i></button>
                        <button class="w-8 h-8 rounded-full text-gray-400"><i class="fas fa-border-all"></i></button>
                        <button class="w-8 h-8 rounded-full text-gray-400"><i class="fas fa-columns"></i></button>
                    </div>
                </div>

                <!-- Exemplo do Novo Card de Tarefa -->
                <div class="task-item p-4 flex items-center gap-4 mb-4">
                    <input type="checkbox" class="w-6 h-6 rounded-full border-2 border-gray-300 accent-[var(--accent)] cursor-pointer">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[var(--accent-2)] to-[var(--accent)] flex-shrink-0 flex items-center justify-center text-white text-lg shadow-inner">
                        <i class="fas fa-vial"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-800 text-base truncate">Testes Diários UI</h4>
                        <div class="flex gap-3 text-[10px] font-extrabold text-gray-400 mt-1 uppercase tracking-wide">
                            <span><i class="far fa-clock mr-1"></i>2h</span>
                            <span class="text-orange-400"><i class="fas fa-circle mr-1"></i>Média</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Doca Inferior -->
        <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-white via-white/80 to-transparent pointer-events-none flex justify-center z-50">
            <div class="glass-dock pointer-events-auto flex items-center gap-3 px-4 py-3">
                <button class="nav-btn active" data-view="home"><i class="fas fa-home"></i></button>
                <button class="nav-btn" data-view="calendar"><i class="fas fa-calendar-alt"></i></button>
                <button class="nav-btn" data-view="finances"><i class="fas fa-wallet"></i></button>
                
                <button id="add-btn" class="acrylic-fab rounded-full flex items-center justify-center text-white text-2xl border-4 border-white -translate-y-6 mx-2 relative z-10">
                    <i class="fas fa-plus drop-shadow-md"></i>
                </button>

                <button class="nav-btn" data-view="hobbies"><i class="fas fa-gamepad"></i></button>
                <button class="nav-btn" data-view="zen"><i class="fas fa-leaf"></i></button>
                <button class="nav-btn" data-view="profile"><i class="fas fa-cog"></i></button>
            </div>
        </div>

        <!-- Painel de Configurações (Bottom Sheet) -->
        <div id="sheet-profile" class="absolute inset-0 z-40 bg-black/20 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
            <div class="absolute bottom-0 left-0 w-full bg-white rounded-t-[40px] p-6 transform translate-y-full transition-transform duration-500 shadow-2xl h-[85vh] overflow-y-auto no-scrollbar">
                <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
                <h2 class="text-2xl font-black text-gray-800 mb-6">Ajustes & Temas</h2>
                
                <!-- Seleção de Temas -->
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3">Estética Cocoon</h3>
                <div class="grid grid-cols-2 gap-3 mb-8">
                    <button class="theme-btn p-4 rounded-2xl border-2 border-gray-100 flex items-center gap-3 text-left" data-theme="strawberry">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#f2d0d9] to-[#d88c9a]"></div>
                        <span class="font-bold text-gray-700 text-sm">Strawberry</span>
                    </button>
                    <button class="theme-btn p-4 rounded-2xl border-2 border-gray-100 flex items-center gap-3 text-left" data-theme="pudding">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#faedcb] to-[#d4a373]"></div>
                        <span class="font-bold text-gray-700 text-sm">Pudding</span>
                    </button>
                    <button class="theme-btn p-4 rounded-2xl border-2 border-gray-100 flex items-center gap-3 text-left" data-theme="matcha">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#dad7cd] to-[#a3b18a]"></div>
                        <span class="font-bold text-gray-700 text-sm">Matcha</span>
                    </button>
                    <button class="theme-btn p-4 rounded-2xl border-2 border-gray-100 flex items-center gap-3 text-left" data-theme="ocean">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#cae9ff] to-[#5fa8d3]"></div>
                        <span class="font-bold text-gray-700 text-sm">Ocean</span>
                    </button>
                </div>

                <!-- Nova Interface de Dificuldade -->
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3">Dificuldade da Tarefa (Preview)</h3>
                <div class="flex gap-3 bg-gray-50 p-4 rounded-2xl w-max">
                    <div class="diff-dot diff-1 active"></div>
                    <div class="diff-dot diff-2"></div>
                    <div class="diff-dot diff-3"></div>
                    <div class="diff-dot diff-4"></div>
                    <div class="diff-dot diff-5"></div>
                </div>

            </div>
        </div>

    </div>

    <script>
        // 1. Gestão do Avatar Customizado (Base64)
        const avatarUpload = document.getElementById('avatar-upload');
        const userAvatar = document.getElementById('user-avatar');
        
        // Carrega avatar salvo no localStorage
        const savedAvatar = localStorage.getItem('aerosync.avatar');
        if(savedAvatar) userAvatar.src = savedAvatar;

        avatarUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64 = event.target.result;
                    userAvatar.src = base64;
                    localStorage.setItem('aerosync.avatar', base64); // Salva localmente
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. Sistema de Temas
        const THEMES = {
            strawberry: { accent: '#d88c9a', accent2: '#f2d0d9', glow: 'rgba(216, 140, 154, 0.35)', soft: '#fcf3f5' },
            pudding: { accent: '#d4a373', accent2: '#faedcb', glow: 'rgba(211, 163, 115, 0.35)', soft: '#fdf9f1' },
            matcha: { accent: '#a3b18a', accent2: '#dad7cd', glow: 'rgba(163, 177, 138, 0.35)', soft: '#f6f7f4' },
            ocean: { accent: '#5fa8d3', accent2: '#cae9ff', glow: 'rgba(95, 168, 211, 0.35)', soft: '#f2f8fc' }
        };

        function applyTheme(themeName) {
            const t = THEMES[themeName];
            if(!t) return;
            const root = document.documentElement.style;
            root.setProperty('--accent', t.accent);
            root.setProperty('--accent-2', t.accent2);
            root.setProperty('--accent-glow', t.glow);
            root.setProperty('--accent-soft', t.soft);
            localStorage.setItem('aerosync.themeId', themeName);
        }

        // Carrega tema salvo
        const savedThemeId = localStorage.getItem('aerosync.themeId') || 'strawberry';
        applyTheme(savedThemeId);

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
        });

        // 3. Lógica Simples da Doca e Modais (Preparação)
        const profileBtn = document.querySelector('[data-view="profile"]');
        const profileSheet = document.getElementById('sheet-profile');
        const sheetContent = profileSheet.querySelector('div');

        profileBtn.addEventListener('click', () => {
            profileSheet.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => sheetContent.classList.remove('translate-y-full'), 50);
        });

        profileSheet.addEventListener('click', (e) => {
            if(e.target === profileSheet) {
                sheetContent.classList.add('translate-y-full');
                setTimeout(() => profileSheet.classList.add('opacity-0', 'pointer-events-none'), 300);
            }
        });

    </script>
</body>
</html>
