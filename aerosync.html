<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{var a=JSON.parse(localStorage.getItem('aerosync.appearance')||'{}')||{};var dk=a.mode==='dark'||(a.mode!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(dk)document.documentElement.classList.add('dark');if(a.style==='simple')document.documentElement.setAttribute('data-style','simple');var th=JSON.parse(localStorage.getItem('aerosync.theme')||'null');if(th&&th.id){var st=document.documentElement.style,ok=function(c){return typeof c==='string'&&/^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\))$/i.test(c)};[['--theme-accent','accent'],['--theme-accent-2','accent2'],['--theme-soft','soft'],['--theme-glow','glow'],['--on-accent','on'],['--surface','surface'],['--page','page']].forEach(function(k){if(ok(th[k[1]]))st.setProperty(k[0],th[k[1]])});}}catch(e){}</script>
    <title>AeroSync</title>
</head>
<body>
    <div class="mobile-frame">
        <div class="px-6 pt-8 pb-2 flex justify-between items-center z-10">
            <div>
                <h1 id="app-title" class="text-3xl font-black text-gray-800 tracking-tight">Organização</h1>
            </div>
        </div>
        <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar pb-32 px-6 pt-4 relative">
            <div id="view-tasks" class="view-section block">
                <!-- Conteúdo existente das tarefas -->
            </div>
        </div>
        <!-- Barra de navegação original (simulada aqui para receber o botão) -->
        <div class="absolute bottom-0 left-0 w-full p-6 flex justify-center z-50">
            <div class="glass-dock flex items-center gap-3 px-4 py-3">
                <button class="nav-btn active" data-view="home">H</button>
                <button class="nav-btn" data-view="calendar">C</button>
                <button class="nav-btn" id="open-finances-btn" aria-label="Finanças">F</button>
            </div>
        </div>
    </div>

<!-- ==================== MÓDULO DE FINANÇAS (ISOLADO) ==================== -->
<style>
    #fin-sheet {
        position: absolute; inset: 0; z-index: 86;
        background: rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(8px) brightness(0.92);
        opacity: 0; visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    #fin-sheet.open { opacity: 1; visibility: visible; }
    #fin-sheet .fin-panel {
        position: absolute; left: 0; right: 0; bottom: 0;
        height: calc(100% - 48px); display: flex; flex-direction: column;
        padding: 12px 20px 24px; border-radius: 32px 32px 0 0;
        background: linear-gradient(160deg, rgba(255,255,255,0.97), rgba(255,255,255,0.90));
        transform: translateY(100%);
        transition: transform 0.38s ease;
    }
    #fin-sheet.open .fin-panel { transform: none; }
    .fin-tabs { display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: rgba(241,245,249,0.9); margin-bottom: 14px; overflow-x: auto; }
    .fin-tab { flex: 1; white-space: nowrap; padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #6b7280; cursor: pointer;}
    .fin-tab.active { background: #fff; color: #3b82f6; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .fin-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 22px; padding: 14px; margin-bottom: 12px; }
    .fin-hero { background: linear-gradient(135deg, #3b82f6, #22d3ee); color: #fff; border-radius: 24px; padding: 18px; margin-bottom: 14px; }
</style>

<div id="fin-sheet" aria-hidden="true">
    <div class="fin-panel" role="dialog">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-xl font-extrabold text-gray-800">Finanças</h2>
            <button id="fin-close" class="modal-x text-lg">X</button>
        </div>
        <div class="fin-tabs no-scrollbar" id="fin-tabs">
            <button class="fin-tab active" data-ftab="overview">Resumo & Cofres</button>
            <button class="fin-tab" data-ftab="expenses">Gastos</button>
            <button class="fin-tab" data-ftab="stats">Estatísticas</button>
            <button class="fin-tab" data-ftab="sim">Simulador</button>
            <button class="fin-tab" data-ftab="rec">Recorrentes</button>
        </div>
        <div id="fin-body" class="sheet-body no-scrollbar">
            <p>Módulo de finanças carregado com sucesso.</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('open-finances-btn').addEventListener('click', () => {
        document.getElementById('fin-sheet').classList.add('open');
    });
    document.getElementById('fin-close').addEventListener('click', () => {
        document.getElementById('fin-sheet').classList.remove('open');
    });
    document.getElementById('fin-tabs').addEventListener('click', (e) => {
        if(e.target.tagName === 'BUTTON') {
            document.querySelectorAll('.fin-tab').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById('fin-body').innerHTML = '<p>Aba ' + e.target.innerText + ' ativada.</p>';
        }
    });
</script>
</body>
</html>
